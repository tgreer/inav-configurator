name: Release

# Official GitHub Releases. Tag a merged version bump (e.g. v9.1.2) to build
# signed + notarized macOS artifacts and publish them on this repo.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: build
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      require_signing: true

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: ${{ github.ref_name }}
          name: INAV Configurator ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/*
          body: |
            macOS builds in this release are signed and notarized with a Developer ID certificate.
